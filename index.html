<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#203e60"><meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<title>端末内ラウンド報告書</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest">
<script defer src="model.js"></script><script defer src="app.js"></script></head>
<body><header class="screen"><span class="badge">端末内に保存</span><h1>ラウンド報告書</h1><p>写真を撮って、気づきを記録。A4縦の報告書にまとめます。</p></header>
<main><section class="screen panel"><p>入力内容と写真はこのブラウザー内に保存します。写真を外部サーバーへ送信する機能はありません。端末の初期化・閲覧データ削除に備えて、必要なデータは書き出してください。</p>
<div class="toolbar"><label>保存した報告書<select id="reports"><option value="">選択してください</option></select></label><button id="new">新規作成</button></div>
<p id="status" role="status" aria-live="polite">読み込み中…</p>
<div class="toolbar"><button id="save" class="primary">この端末に保存</button><button id="export">編集データを書き出す</button><label class="button">編集データを開く<input id="import" type="file" accept="application/json,.json" hidden></label></div>
<small>編集データには写真とコメントが含まれます。PCで続きを編集する場合は、このファイルを移して同じアプリで開いてください。</small></section>
<section class="screen panel"><div class="grid"><label>場所<input id="place" maxlength="40" placeholder="○○病棟"></label><label>日付<input id="date" type="date"></label><label>時間<input id="time" maxlength="40" placeholder="14:00〜14:30"></label><label>参加者<textarea id="participants" maxlength="160" rows="2"></textarea></label></div><label>1ページの件数<select id="count"><option>3</option><option>4</option><option>5</option></select></label></section>
<section id="editor" class="screen"></section>
<section class="screen panel"><button id="pdf" class="primary">A4のPDFを作る／印刷</button><p>iPhone：印刷プレビューを2本指で広げ、共有ボタン →「ファイルに保存」を選びます。PC：「PDFに保存」を選んでください。</p><button id="delete" class="danger">この報告書を端末から削除</button></section>
<section id="paper" aria-label="A4報告書プレビュー"><h1 id="paper-title"></h1><p id="paper-meta"></p><div id="paper-items"></div><footer>1 / 1</footer></section></main>
</body></html>
